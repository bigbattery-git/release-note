services:
  scheduler:
    build: ./scheduler
    init: true

  web:
    build: ./web
    init: true
    command: ["npm", "run", "dev", "--", "--webpack"]
    volumes:
      - ./web/app:/app/app
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "1000"
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ${MARIADB_ROOT_PASSWORD:-local-development-only}
      SESSION_PASSWORD: ${SESSION_PASSWORD:-}
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:11.8
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-local-development-only}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mariadb_data:
